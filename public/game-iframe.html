<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <title>ChaseTagBattle</title>
    <!-- <link rel="shortcut icon" href="TemplateData/favicon.ico" /> -->
    <link rel="stylesheet" href="TemplateData/game-iframe.css" />
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length
            ? "block"
            : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning")
            div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function initGame(buildUrl, filePrefix) {
        var loaderUrl = buildUrl + "/" + filePrefix + ".loader.js";
        var config = {
          arguments: [],
          dataUrl: buildUrl + "/" + filePrefix + ".data",
          frameworkUrl: buildUrl + "/" + filePrefix + ".framework.js",
          codeUrl: buildUrl + "/" + filePrefix + ".wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "YGTCreate",
          productName: "ChaseTag",
          productVersion: "0.1.0",
          showBanner: unityShowBanner,
        };

        config.matchWebGLToCanvasSize = true;

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement("meta");
          meta.name = "viewport";
          meta.content =
            "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
          document.getElementsByTagName("head")[0].appendChild(meta);
          document.querySelector("#unity-container").className = "unity-mobile";
          canvas.className = "unity-mobile";
        } else {
          var container = document.querySelector("#unity-container");
          var rect = container.getBoundingClientRect();
          canvas.width = rect.width;
          canvas.height = rect.height;
        }

        document.querySelector("#unity-loading-bar").style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            document.querySelector("#unity-progress-bar-full").style.width =
              100 * progress + "%";
          })
            .then((unityInstance) => {
              document.querySelector("#unity-progress-bar-full").style.width =
                "100%";
              setTimeout(() => {
                document.querySelector("#unity-loading-bar").style.display =
                  "none";
              }, 500);
            })
            .catch((message) => {
              alert(message);
            });
        };

        document.body.appendChild(script);
      }

      // build-config.json から読み込むビルドフォルダを動的に決定
      fetch("build-config.json")
        .then(function (r) { return r.json(); })
        .then(function (buildConfig) {
          var buildUrl = buildConfig.buildFolder
            ? "Build/" + buildConfig.buildFolder
            : "Build";
          initGame(buildUrl, buildConfig.buildFolder || "Pre");
        })
        .catch(function (err) {
          console.error("build-config.json の読み込みに失敗:", err);
          initGame("Build", "Pre");
        });

      // 親ページの全画面表示を操作する関数
      const exitParentFullscreen = async () => {
        try {
          if (window.parent && window.parent.exitFullscreen) {
            await window.parent.exitFullscreen();
          }
        } catch (error) {
          console.error("親ページの全画面表示終了に失敗しました:", error);
        }
      };

      // ESCキーで親ページの全画面表示を終了
      document.addEventListener("keydown", async (event) => {
        if (event.key === "Escape") {
          // 親ページが全画面表示中かどうかを確認
          try {
            if (window.parent) {
              const parentDoc = window.parent.document;
              const isFullscreen =
                parentDoc.fullscreenElement ||
                parentDoc.webkitFullscreenElement ||
                parentDoc.mozFullScreenElement ||
                parentDoc.msFullscreenElement;

              if (isFullscreen) {
                event.preventDefault();
                event.stopPropagation();
                await exitParentFullscreen();
              }
            }
          } catch (e) {
            // クロスオリジンの場合はエラーになるが、無視
          }
        }
      });
    </script>

    <!-- Screenshot capture functionality (F6 key) -->
    <script src="TemplateData/screenshot.js"></script>
  </body>
</html>
